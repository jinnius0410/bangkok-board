<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F3">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bangkok">
<title>Bangkok Board, 16 to 23 Nov 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FFEBEE'/><rect x='3' y='3' width='94' height='94' rx='21' fill='none' stroke='%23E60023' stroke-width='3'/><text x='50' y='67' font-size='50' text-anchor='middle' fill='%23B3001B' font-family='Arial' font-weight='700'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Anuphan:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1F2430; --ink2:#636C7B; --ink3:#8E97A5;
  --line:#DFE3E9; --chip:#E3E8EE; --chip2:#D9DFE6;
  --red:#E60023; --red-f:#FFEBEE; --red-t:#B3001B;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --sans:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --thai:'Anuphan','Schibsted Grotesk',sans-serif;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-size-adjust:100%;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:inherit}
img{display:block}
.mono{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.09em;font-size:9.5px;line-height:1.3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* press feedback */
.press{transition:transform 160ms var(--ease-out),background-color 160ms var(--ease-out),box-shadow 160ms var(--ease-out)}
.press:active{transform:scale(.97)}

/* ---------- header ---------- */
.wrap{max-width:1440px;margin:0 auto}
.top{padding:calc(14px + env(safe-area-inset-top)) var(--pad) 0}
.bar1{display:flex;align-items:center;justify-content:space-between;height:40px}
.bar1 .mono{color:var(--ink2);font-size:10px}
.icons{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;position:relative;color:var(--ink)}
.ib svg{width:19px;height:19px}
.ib.on{background:var(--red-f);box-shadow:inset 0 0 0 1px var(--red);color:var(--red-t)}
.ib .dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font:600 10px/16px var(--sans);text-align:center}
.ib .dot[hidden]{display:none}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px}
.title h1{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0;text-wrap:balance}
.title .mono{color:var(--ink2);white-space:nowrap}

.search{overflow:hidden;max-height:0;opacity:0;transition:max-height 260ms var(--ease-out),opacity 200ms var(--ease-out),margin 260ms var(--ease-out)}
.search.on{max-height:60px;opacity:1;margin-top:14px}
.search label{display:flex;align-items:center;gap:10px;height:46px;border-radius:14px;background:var(--surface);padding:0 8px 0 14px;box-shadow:inset 0 0 0 1px var(--line)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:16px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.search .x svg{width:16px;height:16px;color:currentColor}

.days{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:16px -4px 0}
.days button{height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.days b{font-size:15px;font-weight:600;line-height:1.15}
.days small{font-size:10px;font-weight:500;color:var(--ink3);line-height:1.2}
.days .all b{font-size:13px}
.days button.on{background:var(--red-f);box-shadow:inset 0 0 0 1px var(--red);color:var(--red-t)}
.days button.on small{color:inherit;opacity:.8}
.days .plan:after{content:"";position:absolute;top:6px;right:calc(50% - 13px);width:5px;height:5px;border-radius:50%;background:var(--red)}

/* sticky category row */
.cats{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top)}
.cats .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px var(--pad);scroll-padding:0 var(--pad);overscroll-behavior-x:contain}
.cats .row::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 13px;border-radius:999px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.on{font-weight:600;background:color-mix(in oklab,var(--c) 11%,white);box-shadow:inset 0 0 0 1px var(--c);color:color-mix(in oklab,var(--c) 78%,black)}
.chip.plain{background:var(--chip);color:var(--ink)}
.chip.plain.on{background:color-mix(in oklab,var(--c) 11%,white)}

.status{display:flex;align-items:center;gap:12px;padding:4px var(--pad) 0;min-height:22px}
.status .mono{color:var(--ink2)}
.status button.mono{color:var(--red-t)}

.notice{margin:12px var(--pad) 0;background:var(--surface);border-radius:16px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start}
.notice .mono{color:var(--red-t);display:block;margin-bottom:3px}
.notice p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2);text-wrap:pretty}
.notice p b{color:var(--ink);font-weight:600}
.notice .x{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink3);margin:-4px -4px 0 0}
.notice .x svg{width:16px;height:16px}

/* ---------- grid ---------- */
.grid{display:flex;align-items:flex-start;gap:12px;padding:16px var(--pad) 40px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px}
.card{display:block;text-align:left;width:100%;cursor:pointer}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--chip);isolation:isolate}
.ph .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.ph .sl::-webkit-scrollbar{display:none}
.ph img{flex:0 0 100%;width:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;background:var(--chip)}
.ph:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);pointer-events:none}
.pd{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:4px;justify-content:center;pointer-events:none;z-index:1}
.pd i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);transition:background-color 200ms var(--ease-out),width 200ms var(--ease-out)}
.pd i.on{background:#fff}
.flag{position:absolute;top:8px;left:8px;z-index:1;height:24px;padding:0 9px;border-radius:999px;display:flex;align-items:center;background:var(--red-f);box-shadow:inset 0 0 0 1px var(--red);color:var(--red-t)}
.flag.mono{font-size:9px}
.svd{position:absolute;top:8px;right:8px;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--red-f);box-shadow:inset 0 0 0 1px var(--red);color:var(--red-t)}
.svd svg{width:14px;height:14px}
.card .tg{margin-top:10px}
.card .t{font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin-top:3px;text-wrap:balance}
.card .ln{margin-top:4px;font-size:13px;font-weight:500;line-height:1.35}
.card .ln+.ln{margin-top:1px}
.card .pz{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.card .pz .mono{color:var(--ink3);letter-spacing:.04em;white-space:nowrap}
.vnd{display:block;margin-top:3px;color:var(--ink3);letter-spacing:.04em}
/* converter */
.cv .sc{padding:24px 20px 0}
.cv .lab{display:flex;justify-content:space-between;align-items:center;color:var(--ink3)}
.cv .swap{height:32px;padding:0 12px;border-radius:999px;background:var(--chip);display:flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.cv .swap svg{width:14px;height:14px}
.cv .in{display:flex;align-items:baseline;gap:8px;margin-top:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cv .in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 44px/1.05 var(--sans);letter-spacing:-.03em;color:var(--ink);padding:0}
.cv .in input::placeholder{color:var(--chip2)}
.cv .in b{font-size:24px;font-weight:600;color:var(--ink2)}
.cv .out{margin-top:16px}
.cv .out .mono{color:var(--ink3)}
.cv .out b{display:block;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px;color:var(--red-t);overflow-wrap:anywhere}
.cv .out small{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.cv .qk{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.cv .qk button{height:36px;padding:0 13px;border-radius:999px;background:var(--chip);font-size:13.5px;font-weight:600}
.cv .rule{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:13.5px;line-height:1.5;color:var(--ink2);text-wrap:pretty}
.cv .rule b{color:var(--ink);font-weight:600}
.cv .note{margin-top:12px;color:var(--ink3);line-height:1.6}
.sheet:focus{outline:none}
.card .pl{color:var(--ink2);margin-top:4px}
.empty{width:100%;text-align:center;padding:64px 24px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty button{margin-top:14px}
.foot{padding:0 var(--pad) calc(32px + env(safe-area-inset-bottom));color:var(--ink3);max-width:620px;margin:0 auto;text-align:center}
.foot.mono{font-size:9px;line-height:1.7}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,22,30,.32);opacity:0;pointer-events:none;transition:opacity 500ms var(--ease-drawer)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:calc(100dvh - 44px - env(safe-area-inset-top));background:var(--surface);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform 500ms var(--ease-drawer);will-change:transform;visibility:hidden}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet.drag{transition:none}
.sheet .grab{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--chip2);z-index:3}
.sc{overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 0;-webkit-overflow-scrolling:touch;flex:1;scrollbar-width:thin;scrollbar-color:var(--chip2) transparent}
.sc .ph{border-radius:16px}
.sc .ph img{height:min(46vh,340px)}
.sc .pd{bottom:12px}
.sc .pd i{width:6px;height:6px}
.sb{padding:20px 6px 0}
.sb .tg{display:block}
.sb h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:6px 0 0;text-wrap:balance}
.sb .th{font-family:var(--thai);font-size:15px;line-height:1.3;color:var(--ink2);margin-top:2px}
.kv{margin-top:16px}
.kv div{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45;align-items:baseline}
.kv .mono{width:88px;flex:none;color:var(--ink3)}
.kv span:last-child{font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.sec{border-top:1px solid var(--line);padding:14px 0 2px}
.sec .mono{color:var(--ink3);display:block;margin-bottom:6px}
.sec p{margin:0;font-size:14px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.sec p.tip{color:var(--ink2)}
.warn{color:var(--red-t)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{height:34px;padding:0 12px;border-radius:999px;background:var(--chip);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none}
.links a svg{width:13px;height:13px;color:var(--ink2)}
.sp{height:24px}
.act{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.act .p{flex:1;height:48px;border-radius:14px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;padding:0 16px 0 14px;text-decoration:none}
.act .p svg{width:18px;height:18px}
.act .sq{width:48px;height:48px;flex:none;border-radius:14px;background:var(--chip);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.act .sq svg{width:20px;height:20px}
.act .sq.on{background:var(--red-f);box-shadow:inset 0 0 0 1px var(--red);color:var(--red-t)}
.act .sq[hidden]{display:none}

/* filters sheet */
.fs .sc{padding:22px 20px 0}
.fs h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.fs .grp{margin-top:22px}
.fs .grp>.mono{color:var(--ink3);display:block;margin-bottom:10px}
.fs .opts{display:flex;flex-wrap:wrap;gap:6px}
.fs .chip{--c:var(--red);background:var(--chip);color:var(--ink);height:36px;font-size:13.5px}
.fs .chip.on{background:var(--red-f);box-shadow:inset 0 0 0 1px var(--red);color:var(--red-t)}
.fs .chip small{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink3)}
.fs .chip.on small{color:inherit;opacity:.7}
.fs .act .sec2{height:48px;padding:0 18px;border-radius:14px;background:var(--chip);font-size:15px;font-weight:600}

@media (min-width:760px){
  :root{--pad:28px}
  .title h1{font-size:40px}
  .days{max-width:560px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;max-height:min(88vh,860px);border-radius:28px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform 300ms var(--ease-out),opacity 220ms var(--ease-out)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet .grab{display:none}
  .act{border-radius:0 0 28px 28px}
}
@media (hover:hover){
  .card:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .chip:not(.on):hover{color:var(--ink)}
  .ib:hover{background:var(--chip2)}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:0ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar1">
      <span class="mono">Bangkok board</span>
      <div class="icons">
        <button class="ib press" id="bConv" aria-label="Currency converter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg></button>
        <button class="ib press" id="bSearch" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
        <button class="ib press" id="bSaved" aria-label="Saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.9 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.4 0 5.7 3.3 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg><span class="dot" id="nSaved" hidden></span></button>
        <button class="ib press" id="bFilter" aria-label="More filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="dot" id="nFilter" hidden></span></button>
      </div>
    </div>
    <div class="search" id="search"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="Search places, areas, vibes" autocomplete="off" enterkeyhint="search"><button class="x" id="qx" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label></div>
    <div class="title"><h1 id="h1">16 to 23 Nov</h1><span class="mono" id="h1s"></span></div>
    <div class="days" id="days"></div>
  </header>
  <nav class="cats" aria-label="Categories"><div class="row" id="cats"></div></nav>
  <div class="status" id="status"></div>
  <div id="notice"></div>
  <main class="grid" id="grid"></main>
  <p class="foot mono" id="foot"></p>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <div class="grab"></div>
  <div class="sc" id="sc"></div>
  <div class="act" id="act"></div>
</section>
<section class="sheet fs" id="fsheet" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="grab"></div>
  <div class="sc" id="fsc"></div>
  <div class="act"><button class="sec2 press" id="fReset">Reset</button><button class="p press" id="fDone">Show results</button></div>
</section>

<section class="sheet cv" id="csheet" role="dialog" aria-modal="true" aria-label="Currency converter">
  <div class="grab"></div>
  <div class="sc">
    <div class="lab"><span class="mono" id="cvFrom">Baht</span><button class="swap press" id="cvSwap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg><span id="cvDir">฿ to ₫</span></button></div>
    <label class="in"><input id="cvIn" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount"><b id="cvSym">฿</b></label>
    <div class="out"><span class="mono" id="cvTo">In VND</span><b id="cvOut">0 ₫</b><small id="cvShort"></small></div>
    <div class="qk" id="cvQk"></div>
    <div class="rule" id="cvRule"></div>
    <p class="mono note" id="cvNote"></p>
    <div class="sp"></div>

<script id="meta" type="application/json">{"start":"2026-11-16","end":"2026-11-23","planDays":[17],"cats":{"Music":{"label":"Music","tag":"Music","color":"#C2477A"},"Art":{"label":"Art","tag":"Art","color":"#6D5BB5"},"Martial Arts":{"label":"Fights","tag":"Muay Thai","color":"#C4562A"},"Thrift & Markets":{"label":"Thrift","tag":"Thrift & markets","color":"#B07D1E"},"Cafe":{"label":"Cafés","tag":"Café","color":"#8A6A45"},"Food":{"label":"Food","tag":"Food","color":"#6E8B1F"},"Sightseeing":{"label":"Sights","tag":"Sights","color":"#2E86AB"},"Festival & Events":{"label":"Festivals","tag":"Festival","color":"#3F8A62"},"Nightlife":{"label":"Nightlife","tag":"Nightlife","color":"#3D5A99"}},"areas":["Old Town (Rattanakosin)","Chinatown & Talat Noi","Riverside & Thonburi","Siam & Pathumwan","Silom & Sathorn","Sukhumvit (Asok-Phrom Phong)","Thonglor & Ekkamai","Ari & Phaya Thai","Chatuchak & Lat Phrao","Ratchada & Huai Khwang","Bang Na & East","Outside Bangkok"],"prices":["Free","Under ฿300","฿300–999","฿1,000–2,999","฿3,000+","Check price"],"notice":"Royal mourning period around the Grand Palace until mid-December: dress modestly in darker colours there, and expect road closures near Sanam Luang on \u003cb>Sun 22 Nov\u003c/b>. \u003cb>Loy Krathong is Tue 24 Nov\u003c/b>, but the Mahakan Fort festivities start Mon 23 Nov.","footer":"Researched 13 Nov 2026 from official sites, ticketing pages, Facebook events and recent guides. Hours and prices change, so check before you go.","rate":760,"rateDate":"13 Nov 2026"}</script>
<script>
(()=>{
const ITEMS=JSON.parse(document.getElementById('data').textContent);
const META=JSON.parse(document.getElementById('meta').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT=META.cats; // {key:{label,tag,color}}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TRIP=[]; for(let d=new Date(META.start+'T00:00:00');d<=new Date(META.end+'T00:00:00');d.setDate(d.getDate()+1)) TRIP.push(new Date(d));
const ICON={
 heart:(f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.9 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.4 0 5.7 3.3 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>`,
 nav:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 3.4 3.9 10.2c-.9.4-.8 1.7.1 1.9l6.6 1.4 1.4 6.6c.2.9 1.5 1 1.9.1l6.8-16.7c.3-.7-.4-1.4-1.1-1.1z"/></svg>`,
 ticket:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10V8.3C3 7.6 3.6 7 4.3 7h15.4c.7 0 1.3.6 1.3 1.3V10a2.5 2.5 0 0 0 0 5v1.7c0 .7-.6 1.3-1.3 1.3H4.3c-.7 0-1.3-.6-1.3-1.3V15a2.5 2.5 0 0 0 0-5z"/><path d="M14.5 9v8" stroke-dasharray="2 2"/></svg>`,
 link:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/></svg>`,
 x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`
};
const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=String(v)}}}})();
const LS='bkk-saved-v1';
let saved=new Set(JSON.parse(store.getItem(LS)||'[]'));
const st={cat:null,day:null,q:'',saved:false,kinds:new Set(),areas:new Set(),prices:new Set(),sort:'smart'};
// default to today if it falls inside the trip (Bangkok time)
const bkkNow=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Bangkok'}));
const todayIdx=TRIP.findIndex(d=>d.toDateString()===new Date(bkkNow.getFullYear(),bkkNow.getMonth(),bkkNow.getDate()).toDateString());
if(todayIdx>=0) st.day=TRIP[todayIdx];

/* ---------- baht to dong ---------- */
const RATE=META.rate||760;
function fmtK(v){ // v in dong
  if(v>=1e6){const m=Math.round(v/1e5)/10;return (Number.isInteger(m)?String(m):m.toFixed(1).replace('.',','))+'tr';}
  if(v>=1e5) return Math.round(v/5000)*5+'k';
  return Math.max(1,Math.round(v/1000))+'k';
}
function fmtRange(a,b){
  if(a===b) return fmtK(a);
  const A=fmtK(a),B=fmtK(b);
  if(A.endsWith('k')&&B.endsWith('k')) return A.slice(0,-1)+'-'+B;
  if(A.endsWith('tr')&&B.endsWith('tr')) return A.slice(0,-2)+'-'+B;
  return A+'-'+B;
}
function toVnd(p){
  if(!p||!/฿/.test(p)) return '';
  const ns=(p.replace(/(\d),(\d{3})/g,'$1$2').match(/\d+(\.\d+)?/g)||[]).map(Number).filter(n=>n>=5);
  if(!ns.length) return '';
  const lo=Math.min(...ns)*RATE, hi=Math.max(...ns)*RATE;
  const plus=/\bfrom\b|\+/i.test(p)&&ns.length===1;
  if(/\bunder\b|\bup to\b/i.test(p)) return '≈ under '+fmtK(hi);
  if(/free/i.test(p)&&ns.length===1) return '≈ 0-'+fmtK(hi);
  return '≈ '+fmtRange(lo,hi)+(plus?'+':'');
}
const dotNum=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');

const d0=s=>s?new Date(s+'T00:00:00'):null;
function onDay(it,day){
  if(it.kind==='event'){const A=d0(it.startDate),B=d0(it.endDate)||A;return A&&day>=A&&day<=B;}
  if(Array.isArray(it.days)&&it.days.length) return it.days.includes(DOW[day.getDay()]);
  if(!it.closed) return true;
  const c=String(it.closed).toLowerCase(), f=DOWL[day.getDay()].toLowerCase(), s=DOW[day.getDay()].toLowerCase();
  return !new RegExp('\\b('+f+'|'+s+')s?\\b').test(c);
}
function match(it,skip){
  if(st.saved&&!saved.has(it.id)) return false;
  if(skip!=='cat'&&st.cat&&it.category!==st.cat) return false;
  if(skip!=='kinds'&&st.kinds.size&&!st.kinds.has(it.kind)) return false;
  if(skip!=='areas'&&st.areas.size&&!st.areas.has(it.area)) return false;
  if(skip!=='prices'&&st.prices.size&&!st.prices.has(it.priceBand)) return false;
  if(st.day&&!onDay(it,st.day)) return false;
  if(st.q){const h=[it.title,it.name,it.thai,it.place,it.area,CAT[it.category].label,it.description,it.tip,(it.tags||[]).join(' ')].join(' ').toLowerCase();
    if(!st.q.toLowerCase().split(/\s+/).every(w=>h.includes(w))) return false;}
  return true;
}
function sorted(a){
  a=[...a];
  if(st.sort==='az') a.sort((x,y)=>x.title.localeCompare(y.title));
  else if(st.sort==='date') a.sort((x,y)=>(x.kind==='event'?0:1)-(y.kind==='event'?0:1)||String(x.startDate||'').localeCompare(String(y.startDate||'')));
  else a.sort((x,y)=>(y.pin||0)-(x.pin||0)||x.order-y.order);
  return a;
}

/* ---------- header ---------- */
function renderHead(){
  if(st.day){
    $('#h1').textContent=`${DOWL[st.day.getDay()]} ${st.day.getDate()}`;
    $('#h1s').textContent=`Day ${TRIP.findIndex(d=>+d===+st.day)+1} of ${TRIP.length}`;
  } else {$('#h1').textContent='16 to 23 Nov';$('#h1s').textContent=`${TRIP.length} days`;}
  const dz=$('#days');
  dz.innerHTML=`<button class="all press${st.day?'':' on'}" data-i="-1"><b>All</b><small>days</small></button>`+
   TRIP.map((d,i)=>`<button class="press${st.day&&+st.day===+d?' on':''}${META.planDays.includes(d.getDate())?' plan':''}" data-i="${i}" aria-label="${DOWL[d.getDay()]} ${d.getDate()} November"><b>${d.getDate()}</b><small>${DOW[d.getDay()]}</small></button>`).join('');
  dz.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.day=(i<0||(st.day&&+st.day===+TRIP[i]))?null:TRIP[i];render();});
}
function renderCats(){
  const row=$('#cats');
  const all=`<button class="chip press${st.cat?'':' on'}" style="--c:var(--red)" data-c="">Everything</button>`;
  row.innerHTML=all+Object.entries(CAT).filter(([k])=>ITEMS.some(it=>it.category===k)).map(([k,v])=>`<button class="chip press${st.cat===k?' on':''}" style="--c:${v.color}" data-c="${esc(k)}"><i></i>${esc(v.label)}</button>`).join('');
  row.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c||null;render();window.scrollTo({top:Math.min(scrollY,$('.cats').offsetTop),behavior:'smooth'});});
  const on=row.querySelector('.chip.on');
  if(on){const l=on.offsetLeft-16,r=on.offsetLeft+on.offsetWidth+16;if(l<row.scrollLeft)row.scrollLeft=l;else if(r>row.scrollLeft+row.clientWidth)row.scrollLeft=r-row.clientWidth;}
}
function renderStatus(list){
  const extra=st.kinds.size+st.areas.size+st.prices.size;
  $('#nFilter').hidden=!extra; $('#nFilter').textContent=extra;
  $('#nSaved').hidden=!saved.size; $('#nSaved').textContent=saved.size;
  $('#bSaved').classList.toggle('on',st.saved);
  const parts=[`${list.length} ${list.length===1?'pick':'picks'}`];
  if(st.saved) parts.push('saved only');
  if(st.q) parts.push(`"${st.q}"`);
  const dirty=st.saved||st.q||extra||st.cat||st.day;
  $('#status').innerHTML=`<span class="mono">${esc(parts.join(', '))}</span>${dirty?'<button class="mono press" id="clr">Clear all</button>':''}`;
  const c=$('#clr'); if(c) c.onclick=resetAll;
}
function renderNotice(){
  const n=$('#notice');
  if(store.getItem('bkk-notice-v2')==='x'){n.innerHTML='';return;}
  n.innerHTML=`<div class="notice"><div><span class="mono">Heads-up</span><p>${META.notice}</p></div><button class="x press" aria-label="Dismiss">${ICON.x}</button></div>`;
  n.querySelector('.x').onclick=()=>{store.setItem('bkk-notice-v2','x');n.innerHTML='';};
}

/* ---------- cards ---------- */
function photos(it,cls){
  const im=it.images||[]; const r=Math.max(.72,Math.min(1.35,it.ratio||1));
  if(!im.length) return `<div class="ph ${cls||''}" style="aspect-ratio:${r}"></div>`;
  return `<div class="ph ${cls||''}"><div class="sl">${im.map((s,i)=>`<img src="${esc(s)}" alt="${i?'':esc(it.title)}" loading="${cls?'eager':'lazy'}" decoding="async" style="aspect-ratio:${cls?'auto':r}">`).join('')}</div>${im.length>1?`<div class="pd">${im.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}</div>`;
}
function cardHTML(it){
  const c=CAT[it.category];
  return `<article class="card" data-id="${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.title)}">
   <div style="position:relative">${photos(it)}${it.pin?'<span class="flag mono">Your plan</span>':''}${saved.has(it.id)?`<span class="svd">${ICON.heart(true)}</span>`:''}</div>
   <span class="tg mono" style="color:${c.color}">${esc(c.tag)}</span>
   <div class="t">${esc(it.title)}</div>
   <div class="ln">${esc(it.when)}</div>
   <div class="ln pz"><span>${esc(it.price)}</span>${toVnd(it.price)?`<span class="mono">${esc(toVnd(it.price))}</span>`:''}</div>
   <div class="pl mono">${esc(it.place)}</div>
  </article>`;
}
function wireSlides(root){
  root.querySelectorAll('.ph').forEach(ph=>{
    const sl=ph.querySelector('.sl'),dots=ph.querySelectorAll('.pd i'); if(!sl||!dots.length) return;
    let raf; sl.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',i===j));});},{passive:true});
  });
}
let LIST=[],COLS=0;
const colCount=()=>{const w=document.documentElement.clientWidth;return w<370?1:w<720?2:Math.max(3,Math.min(7,Math.floor((w-56)/236)));};
function layout(force){
  const n=colCount(); if(!force&&n===COLS) return; COLS=n;
  const g=$('#grid'); g.innerHTML='';
  if(!LIST.length){g.innerHTML=`<div class="empty"><b>Nothing here yet</b>${st.saved?'Tap the heart on a place to save it.':'Try another day or category.'}<br><button class="chip plain press" style="--c:var(--red)" id="emp">Show everything</button></div>`;$('#emp').onclick=resetAll;return;}
  const cols=[...Array(n)].map(()=>{const c=document.createElement('div');c.className='col';g.append(c);return c;});
  const tmp=document.createElement('div');
  for(const it of LIST){tmp.innerHTML=cardHTML(it);let b=cols[0];for(const c of cols) if(c.offsetHeight<b.offsetHeight) b=c;b.append(tmp.firstElementChild);}
  wireSlides(g);
}
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>layout(false),120);});
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c) openItem(c.dataset.id);});
$('#grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openItem(e.target.dataset.id);}});

function render(){
  LIST=sorted(ITEMS.filter(it=>match(it)));
  renderHead();renderCats();renderStatus(LIST);layout(true);
}
function resetAll(){st.cat=null;st.day=null;st.q='';st.saved=false;st.kinds.clear();st.areas.clear();st.prices.clear();st.sort='smart';$('#q').value='';render();}

/* ---------- sheets (open/close + drag to dismiss) ---------- */
let openSheet=null,lastFocus=null;
function show(sh){
  lastFocus=document.activeElement; openSheet=sh;
  sh.style.transform='';sh.classList.add('on');$('#scrim').classList.add('on');$('#scrim').style.opacity='';
  document.documentElement.style.overflow='hidden';
  sh.querySelector('.sc').scrollTop=0;
  sh.setAttribute('tabindex','-1'); setTimeout(()=>sh.focus({preventScroll:true}),60);
}
function hide(){
  if(!openSheet) return; const sh=openSheet; openSheet=null;
  sh.classList.remove('on','drag'); sh.style.transform=''; $('#scrim').classList.remove('on'); $('#scrim').style.opacity='';
  document.documentElement.style.overflow='';
  lastFocus?.focus?.({preventScroll:true});
}
$('#scrim').onclick=hide;
addEventListener('keydown',e=>{if(e.key==='Escape') hide();});
const mobile=()=>innerWidth<760;
document.querySelectorAll('.sheet').forEach(sh=>{
  let y0=0,x0=0,dy=0,t0=0,active=false,h=1,axis=null;
  const sc=sh.querySelector('.sc');
  sh.addEventListener('touchstart',e=>{
    if(!mobile()) return;
    if(sc.contains(e.target)&&sc.scrollTop>0){active=false;return;}
    active=true;axis=null;y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;t0=performance.now();h=sh.offsetHeight;
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!active) return;
    const d=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(!axis){ if(Math.abs(d)<6&&Math.abs(dx)<6) return; axis=Math.abs(dx)>Math.abs(d)?'x':'y'; }
    if(axis==='x'){active=false;return;}
    if(d<=0&&!sh.classList.contains('drag')){return;}
    if(d>0&&sc.scrollTop<=0){
      if(e.cancelable) e.preventDefault();
      sh.classList.add('drag'); dy=d;
      sh.style.transform=`translateY(${dy}px)`;
      $('#scrim').style.opacity=String(Math.max(0,1-dy/h));
    }
  },{passive:false});
  sh.addEventListener('touchend',()=>{
    if(!active) return; active=false;
    if(!sh.classList.contains('drag')) return;
    const v=dy/Math.max(1,performance.now()-t0);
    sh.classList.remove('drag');
    if(dy>h*0.35||v>0.5){hide();}
    else {sh.style.transform='';$('#scrim').style.opacity='';}
  });
});

/* ---------- item sheet ---------- */
function openItem(id){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const c=CAT[it.category];
  const rows=[['When',it.whenFull+(it.closed?`. Closed ${it.closed}`:'')],['Cost',it.priceFull],['Getting there',it.transit],['Address',it.address]].filter(r=>r[1]);
  const vn=toVnd(it.price);
  const links=(it.links||[]).filter(l=>l&&l.url);
  $('#sc').innerHTML=`${photos(it,'big')}
   <div class="sb">
    <span class="tg mono" style="color:${c.color}">${esc(c.tag)}${it.pin?' <span style="color:var(--red-t)">&nbsp;Your plan</span>':''}</span>
    <h2>${esc(it.title)}</h2>${it.thai?`<div class="th" lang="th">${esc(it.thai)}</div>`:''}
    <div class="kv">${rows.map(([k,v])=>`<div><span class="mono">${k}</span><span>${esc(v)}${k==='Cost'&&vn?`<span class="vnd mono">In VND ${esc(vn)}</span>`:''}</span></div>`).join('')}</div>
    ${it.description?`<div class="sec"><span class="mono">About</span><p>${esc(it.description)}</p></div>`:''}
    ${it.tip?`<div class="sec"><span class="mono">Tip</span><p class="tip">${esc(it.tip)}</p></div>`:''}
    ${it.confidence==='unverified'?`<div class="sec"><span class="mono warn">Not fully confirmed</span><p class="tip">Details may change. Check the official link before going.</p></div>`:''}
    ${links.length?`<div class="sec"><span class="mono">Links</span><div class="links">${links.map(l=>`<a class="press" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||'Link')}${ICON.link}</a>`).join('')}</div></div>`:''}
    <div class="sp"></div>
   </div>`;
  const tix=links.find(l=>/ticket/i.test(l.label))||links.find(l=>/official/i.test(l.label))||links[0];
  const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.mapsQuery||it.title+' Bangkok')}`;
  const isS=saved.has(it.id);
  $('#act').innerHTML=`<a class="p press" href="${maps}" target="_blank" rel="noopener">${ICON.nav}Directions</a>
   ${tix?`<a class="sq press" href="${esc(tix.url)}" target="_blank" rel="noopener" aria-label="${esc(tix.label||'Open link')}">${/ticket/i.test(tix.label)?ICON.ticket:ICON.link}</a>`:''}
   <button class="sq press${isS?' on':''}" id="bSave" aria-label="${isS?'Remove from saved':'Save'}" aria-pressed="${isS}">${ICON.heart(isS)}</button>`;
  $('#bSave').onclick=()=>{
    saved.has(it.id)?saved.delete(it.id):saved.add(it.id); store.setItem(LS,JSON.stringify([...saved]));
    const on=saved.has(it.id),b=$('#bSave'); b.classList.toggle('on',on); b.innerHTML=ICON.heart(on); b.setAttribute('aria-pressed',on);
    renderStatus(LIST);
    const card=document.querySelector(`.card[data-id="${CSS.escape(it.id)}"] > div`);
    if(card){card.querySelector('.svd')?.remove(); if(on) card.insertAdjacentHTML('beforeend',`<span class="svd">${ICON.heart(true)}</span>`);}
    if(st.saved&&!on){LIST=sorted(ITEMS.filter(x=>match(x)));layout(true);}
  };
  wireSlides($('#sc'));
  show($('#sheet'));
}

/* ---------- filters sheet ---------- */
const KIND={place:'Places',event:'Events',recurring:'Weekly'};
function cnt(key,val){return ITEMS.filter(it=>match(it,key)&&(key==='kinds'?it.kind===val:key==='areas'?it.area===val:it.priceBand===val)).length;}
function renderFilters(){
  const grp=(label,key,vals,fmt)=>`<div class="grp"><span class="mono">${label}</span><div class="opts">${vals.map(v=>`<button class="chip press${st[key].has(v)?' on':''}" data-k="${key}" data-v="${esc(v)}">${esc(fmt?fmt(v):v)} <small>${cnt(key,v)}</small></button>`).join('')}</div></div>`;
  $('#fsc').innerHTML=`<h2>Filters</h2>
   ${grp('Type','kinds',['place','event','recurring'],v=>KIND[v])}
   ${grp('Area','areas',META.areas)}
   ${grp('Price','prices',META.prices)}
   <div class="grp"><span class="mono">Sort</span><div class="opts">${[['smart','Recommended'],['date','Events by date'],['az','A to Z']].map(([k,l])=>`<button class="chip press${st.sort===k?' on':''}" data-sort="${k}">${l}</button>`).join('')}</div></div>
   <div class="sp"></div>`;
  $('#fsc').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const s=st[b.dataset.k],v=b.dataset.v;s.has(v)?s.delete(v):s.add(v);render();renderFilters();});
  $('#fsc').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{st.sort=b.dataset.sort;render();renderFilters();});
  const n=ITEMS.filter(it=>match(it)).length;
  $('#fDone').textContent=`Show ${n} ${n===1?'pick':'picks'}`;
}
$('#bFilter').onclick=()=>{renderFilters();show($('#fsheet'));};
$('#fDone').onclick=hide;
$('#fReset').onclick=()=>{st.kinds.clear();st.areas.clear();st.prices.clear();st.sort='smart';render();renderFilters();};

/* ---------- search + saved ---------- */
$('#bSearch').onclick=()=>{const s=$('#search'),on=!s.classList.contains('on');s.classList.toggle('on',on);$('#bSearch').classList.toggle('on',on);if(on) setTimeout(()=>$('#q').focus(),50);else if(st.q){st.q='';$('#q').value='';render();}};
let qt; $('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();render();},140);});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter') e.target.blur();});
$('#qx').onclick=e=>{e.preventDefault();st.q='';$('#q').value='';render();$('#q').focus();};
$('#bSaved').onclick=()=>{st.saved=!st.saved;render();};

/* ---------- converter ---------- */
let cvDir='b2d';
function cvRender(){
  const raw=$('#cvIn').value.replace(/[^\d.,]/g,'').replace(/,/g,'');
  const n=parseFloat(raw)||0;
  if(cvDir==='b2d'){
    const v=n*RATE;
    $('#cvOut').textContent=`≈ ${dotNum(v)} ₫`;
    $('#cvShort').textContent=n?`About ${v>=1e6?fmtK(v):Math.max(1,Math.round(v/1000))+'k'}`:'';
  } else {
    const v=n/RATE;
    $('#cvOut').textContent=`≈ ฿${v>=100?Math.round(v).toLocaleString('en-US'):v.toFixed(v<10?2:1)}`;
    $('#cvShort').textContent='';
  }
}
function cvSetup(){
  const b=cvDir==='b2d';
  $('#cvFrom').textContent=b?'Baht':'VND';
  $('#cvTo').textContent=b?'In VND':'In baht';
  $('#cvSym').textContent=b?'฿':'₫';
  $('#cvDir').textContent=b?'฿ to ₫':'₫ to ฿';
  const q=b?[20,50,100,200,500,1000]:[50000,100000,200000,500000,1000000];
  $('#cvQk').innerHTML=q.map(v=>`<button class="press" data-v="${v}">${b?'฿'+v.toLocaleString('en-US'):fmtK(v)}</button>`).join('');
  $('#cvQk').querySelectorAll('button').forEach(x=>x.onclick=()=>{$('#cvIn').value=x.dataset.v;cvRender();});
  $('#cvRule').innerHTML=b?'<b>Quick mental math:</b> baht × 3 ÷ 4, then read it as thousands. ฿200 becomes about 150k.':'<b>Quick mental math:</b> thousands × 4 ÷ 3 gives baht. 150k is about ฿200.';
  $('#cvNote').textContent=`1 ฿ ≈ ${RATE} ₫, mid-market rate on ${META.rateDate}. Exchange booths and cards usually take 1 to 3% more.`;
  $('#cvIn').value='';cvRender();
}
$('#cvIn').addEventListener('input',cvRender);
$('#cvSwap').onclick=()=>{cvDir=cvDir==='b2d'?'d2b':'b2d';cvSetup();$('#cvIn').focus();};
$('#bConv').onclick=()=>{cvSetup();show($('#csheet'));setTimeout(()=>$('#cvIn').focus({preventScroll:true}),350);};

$('#foot').textContent=META.footer;
renderNotice();
render();
})();
